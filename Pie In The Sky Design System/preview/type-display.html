<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFAF5; font-family: 'DM Sans', sans-serif; padding: 24px; }
  .specimen { margin-bottom: 18px; border-bottom: 1px solid #EDE4D5; padding-bottom: 18px; display: flex; align-items: baseline; gap: 16px; }
  .specimen:last-child { border: none; margin-bottom: 0; }
  .meta { min-width: 90px; font-size: 10px; color: #9E8E79; font-weight: 500; letter-spacing: 0.04em; flex-shrink: 0; }
  .sample { flex: 1; color: #5C3A1E; }
</style>
</head><body>
  <div class="specimen">
    <div class="meta">H1 · 56px<br>700 · −0.03em</div>
    <div class="sample" style="font-family:'Playfair Display',serif;font-size:56px;font-weight:700;line-height:1.1;letter-spacing:-0.03em;">One pie.<br>One button.</div>
  </div>
  <div class="specimen">
    <div class="meta">H2 · 40px<br>600</div>
    <div class="sample" style="font-family:'Playfair Display',serif;font-size:40px;font-weight:600;line-height:1.2;">Your pie is airborne.</div>
  </div>
  <div class="specimen">
    <div class="meta">H3 · 24px<br>600</div>
    <div class="sample" style="font-family:'Playfair Display',serif;font-size:24px;font-weight:600;line-height:1.35;">We bake one thing. It's incredible.</div>
  </div>
  <div class="specimen">
    <div class="meta">Display italic<br>40px · 400</div>
    <div class="sample" style="font-family:'Playfair Display',serif;font-size:40px;font-style:italic;font-weight:400;line-height:1.2;color:#D97D18;">"Unreasonably good."</div>
  </div>
</body></html>
