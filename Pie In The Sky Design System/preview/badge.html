<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFAF5; font-family: 'DM Sans', sans-serif; padding: 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 9999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .section { display: flex; flex-direction: column; gap: 8px; }
  .group-title { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9E8E79; margin-bottom: 4px; }
</style>
</head><body>
<div class="section">
  <div class="group-title">Status Badges</div>
  <div class="badge" style="background:#E0F0FC;color:#0D548A"><div class="dot" style="background:#1B8DD4"></div>Pending</div>
  <div class="badge" style="background:#FDEFD8;color:#8F4A0D"><div class="dot" style="background:#D97D18"></div>Airborne</div>
  <div class="badge" style="background:#D1F0E2;color:#1A6B42"><div class="dot" style="background:#2D9E5F"></div>Delivered</div>
  <div class="badge" style="background:#F7F1E8;color:#5C5045"><div class="dot" style="background:#9E8E79"></div>Sold Out</div>
  <div class="badge" style="background:#FDECEA;color:#8B1A11"><div class="dot" style="background:#C0392B"></div>Error</div>
</div>
</body></html>
