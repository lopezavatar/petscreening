<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFAF5; font-family: 'DM Sans', sans-serif; padding: 20px; }
  .group-title { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9E8E79; margin: 0 0 10px; }
  .spacing-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar { background: #F5BC6E; border-radius: 3px; height: 16px; flex-shrink: 0; }
  .label { font-size: 11px; color: #5C3A1E; font-weight: 500; }
  .val { font-size: 10px; color: #9E8E79; margin-left: 4px; }
</style>
</head><body>
<div class="group-title">Spacing Scale</div>
<div class="spacing-row"><div class="bar" style="width:4px"></div><div class="label">--space-1 <span class="val">4px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:8px"></div><div class="label">--space-2 <span class="val">8px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:12px"></div><div class="label">--space-3 <span class="val">12px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:16px"></div><div class="label">--space-4 <span class="val">16px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:20px"></div><div class="label">--space-5 <span class="val">20px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:24px"></div><div class="label">--space-6 <span class="val">24px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:32px"></div><div class="label">--space-8 <span class="val">32px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:40px"></div><div class="label">--space-10 <span class="val">40px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:48px"></div><div class="label">--space-12 <span class="val">48px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:64px"></div><div class="label">--space-16 <span class="val">64px</span></div></div>
<div class="spacing-row"><div class="bar" style="width:96px"></div><div class="label">--space-24 <span class="val">96px</span></div></div>
</body></html>
