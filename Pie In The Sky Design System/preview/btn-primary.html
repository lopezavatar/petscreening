<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFAF5; font-family: 'DM Sans', sans-serif; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .label-row { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9E8E79; text-align: center; }

  .btn-primary {
    background: #D97D18; color: #fff; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 18px 52px; border-radius: 9999px;
    box-shadow: 0 2px 12px rgba(217,125,24,0.30);
    transition: all 300ms cubic-bezier(0.34,1.56,0.64,1);
  }
  .btn-primary.hover { background: #B86210; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(217,125,24,0.40); }
  .btn-primary.press { background: #8F4A0D; transform: scale(0.97); }
  .btn-primary.disabled { background: #BFB09C; box-shadow: none; cursor: not-allowed; }

  .btn-secondary {
    background: transparent; color: #D97D18;
    border: 1.5px solid #D97D18; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: 0.04em; padding: 12px 28px; border-radius: 9999px;
    transition: all 200ms ease;
  }
  .btn-secondary.hover { background: #FFF8EE; }
</style>
</head><body>
  <div class="label-row">Primary CTA</div>
  <div class="row">
    <div><button class="btn-primary">ORDER</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Default</div></div>
    <div><button class="btn-primary hover">ORDER</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Hover</div></div>
    <div><button class="btn-primary press">ORDER</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Press</div></div>
    <div><button class="btn-primary disabled" disabled>ORDER</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Disabled</div></div>
  </div>
  <div class="label-row" style="margin-top:8px">Secondary</div>
  <div class="row">
    <div><button class="btn-secondary">Learn more</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Default</div></div>
    <div><button class="btn-secondary hover">Learn more</button><div style="text-align:center;font-size:10px;color:#9E8E79;margin-top:6px">Hover</div></div>
  </div>
</body></html>
