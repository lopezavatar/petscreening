<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F1E8; font-family: 'DM Sans', sans-serif; padding: 24px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .card {
    background: #fff; border-radius: 16px;
    box-shadow: 0 4px 24px rgba(92,58,30,0.09);
    padding: 24px; width: 240px;
  }
  .overline { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #9E8E79; margin-bottom: 8px; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600; color: #5C3A1E; line-height: 1.25; margin-bottom: 6px; }
  .card-sub { font-size: 13px; color: #7A6C5A; line-height: 1.5; margin-bottom: 20px; }
  .price { font-size: 32px; font-weight: 300; color: #D97D18; letter-spacing: -0.02em; }
  .price span { font-size: 14px; font-weight: 500; color: #9E8E79; margin-left: 4px; }
  .divider { border: none; border-top: 1px solid #EDE4D5; margin: 16px 0; }
  .detail { display: flex; justify-content: space-between; font-size: 12px; color: #7A6C5A; margin-bottom: 6px; }
  .detail strong { color: #5C3A1E; font-weight: 500; }
</style>
</head><body>
  <div class="card">
    <div class="overline">Today's Pie</div>
    <div class="card-title">Signature Cherry Lattice</div>
    <div class="card-sub">Tart Montmorency cherries, buttery crust, baked this morning.</div>
    <div class="price">$24 <span>/ pie</span></div>
    <hr class="divider">
    <div class="detail"><span>Delivery</span><strong>~12 min</strong></div>
    <div class="detail"><span>Serves</span><strong>4–6</strong></div>
    <div class="detail"><span>Status</span><strong style="color:#2D9E5F">Available</strong></div>
  </div>
  <div class="card" style="opacity:0.7">
    <div class="overline">Today's Pie</div>
    <div class="card-title" style="color:#9E8E79">Signature Cherry Lattice</div>
    <div class="card-sub">Back tomorrow at 9am.</div>
    <div class="price" style="color:#BFB09C">$24 <span>/ pie</span></div>
    <hr class="divider">
    <div class="detail"><span>Status</span><strong style="color:#9E8E79">Sold Out</strong></div>
  </div>
</body></html>
